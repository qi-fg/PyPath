name: Build PyPath release

on:
  push:
    branches:
      - main
    paths:
      - version.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and curriculum
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 -m py_compile server.py
          node scripts/validate_course.js
          node scripts/validate_judge.js
          node scripts/validate_tutor.js
          python3 scripts/validate_tutor.py

      - name: Read versions
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_VERSION="$(python -c "import json; d=json.load(open('version.json', encoding='utf-8')); print(d['version'])")"
          RELEASE_VERSION="$(python -c "import json; d=json.load(open('version.json', encoding='utf-8')); print(d.get('displayVersion') or d['version'])")"
          echo "UPDATE_VERSION=$UPDATE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build update package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/PyPath-V$RELEASE_VERSION"
          ZIP="/tmp/PyPath-V$RELEASE_VERSION.zip"
          rm -rf "$STAGE" "$ZIP"
          mkdir -p "$STAGE"
          rsync -a ./ "$STAGE/"             --exclude ".git/"             --exclude ".github/"             --exclude ".release-parts/"             --exclude "release-trigger.json"             --exclude "update-manifest.json"             --exclude "user-data/"             --exclude "*.log"             --exclude "__pycache__/"             --exclude "*.pyc"
          cd /tmp
          zip -qr "PyPath-V$RELEASE_VERSION.zip" "PyPath-V$RELEASE_VERSION"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "PACKAGE_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/PyPath-V$RELEASE_VERSION.zip"
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" "$ZIP" --clobber
          else
            gh release create "v$RELEASE_VERSION" "$ZIP" --title "PyPath V$RELEASE_VERSION" --notes "PyPath V$RELEASE_VERSION"
          fi


      - name: Update online manifest
        shell: bash
        run: |
          python -c "import json,os; u=os.environ['UPDATE_VERSION']; v=os.environ['RELEASE_VERSION']; s=os.environ['PACKAGE_SHA']; json.dump({'version':u,'displayVersion':v,'downloadUrl':f'https://github.com/qi-fg/PyPath/releases/download/v{v}/PyPath-V{v}.zip','sha256':s,'notes':f'PyPath V{v}'}, open('update-manifest.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          printf '\n' >> update-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest for PyPath V$RELEASE_VERSION"
            git push
          fi

